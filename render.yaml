# Render Blueprint for Health Tracking App
# https://render.com/docs/blueprint-spec

services:
  # FastAPI Backend
  - type: web
    name: health-tracking-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: API_KEY
        generateValue: true  # Render generates secure random key
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CORS_ORIGINS
        value: "*"  # Configure for production if needed
    healthCheckPath: /health

  # Streamlit Dashboard
  - type: web
    name: health-tracking-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: HEALTH_API_URL
        sync: false  # Set to API URL after API deploys
      - key: HEALTH_API_KEY
        sync: false  # Copy API_KEY from API service
      - key: PYTHON_VERSION
        value: "3.12"
